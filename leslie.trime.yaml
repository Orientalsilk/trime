preset_keys:
  # 安卓
  BRIGHTNESS_DOWN: {label: 亮度-, send: BRIGHTNESS_DOWN}
  BRIGHTNESS_UP: {label: 亮度+, send: BRIGHTNESS_UP}
  CALCULATOR: {label: 计算机, send: CALCULATOR}
  CALENDAR: {label: 日历, send: CALENDAR}
  CONTACTS: {label: 电话簿, send: CONTACTS}
  ENVELOPE: {label: 信箱, send: ENVELOPE}
  EXPLORER: {label: 浏览器, send: EXPLORER}
  MUSIC: {label: 音乐, send: MUSIC}
  POWER: {label: 电源, send: POWER}
  SLEEP: {label: 休眠, send: SLEEP}
  VOICE_ASSIST: {label: 🎙, functional: true, send: VOICE_ASSIST}
  VOLUME_DOWN: {label: 音量-, send: VOLUME_DOWN}
  VOLUME_UP: {label: 音量+, send: VOLUME_UP}
  VOLUME_MUTE: {label: 静音, send: VOLUME_MUTE}
   # 编辑
  Shift_L: {label: Shift, preview: '⇪', functional: false, send: Shift_L}
  Shift_L3: {label: ⇪, preview: '⇪', functional: false, send: Shift_L, shift_lock: click}
  Return: { label: ic@keyboard-return, preview: '↩', functional: false, send: Return }
  Return1: {label: Enter, preview: '↩', functional: false, send: Return}
  Return2: {label: '  ↲  ', send: Return }
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: ⌫, preview: '⇦', repeatable: true, functional: false, send: BackSpace}
  BackSpace1: {label: ' ⌫ ', preview: '⇦', repeatable: true, functional: false, slide_delete: true, send: BackSpace}
  space: {label: '', slide_cursor: true, send: space}
 # space: {label: 'ic@resistor', slide_cursor: true, send: space}
  space1: {label: '  ⎵ ', send: space}
  space2: {label: ic@keyboard-space, slide_cursor: true, send: space}  #用于数字键盘空格的展现形式
  Clear: {label: Clear, functional: false, text: "{Control+a}{Delete}"}
  Escape: {label: 取消, functional: false, send: Escape}
  Shift_comp: {toggle: en_mode, states: [ ";", "⇪" ], functional: false, send: Control+Shift+9}
  Home: {label: 'ic@page-first', send: Home, functional: false}
  Delete: {label: 删除, send: Delete, functional: false}
  Delete1: {label: Del, send: Delete, functional: false}
  End: {label: 'ic@page-last', send: End, functional: false}
  Page_Up: {label: '上页', send: Page_Up, functional: false}
  Page_Down: {label: '下页', send: Page_Down, functional: false}
  Left: {label: ' ← ', send: Left, repeatable: true, functional: false}
  Down: {label: '↓', send: Down, functional: false}
  Up: {label: '↑', send: Up, functional: false}
  Right: {label: ' → ', send: Right, repeatable: true, functional: false}
  select_all: {label: ☑, functional: false, send: Control+a}
  cut: {label: ✁, functional: false, send: Control+x}
  copy: {label: ❐, functional: false, send: Control+c}
  paste: {label: ▣, functional: false, send: Control+v}
  paste_clip: {label: ic@clipboard-text-outline, send: FUNCTION, command: clipboard}
  redo: {label: ⤻, functional: false, send: Control+Shift+z} #>=Android 6.0
  undo: {label: ⤺, functional: false, send: Control+z} #>=Android 6.0
  delimiter: {label: 分词, text: ''''}
 # x1: {text: '{Home}{Right}{Right}', label: 单字, functional: false}
  #编辑键盘自定义
  BDSS: {label: 🔍️, send: FUNCTION, command: run, option: "https://www.baidu.com/s?wd=%4$s"} # 
  Tab2: {label: "Tab↹", preview: '↹', repeatable: false, text: '    '}
  Shift1: {label: ☩, functional: false, preview: '☩', send: Shift_L, shift_lock: click, key_back_color: hcb, key_text_color: hcs, on_key_back_color: hch, on_key_text_color: hcht, hilited_key_back_color: hch, hilited_key_text_color: hcht} # 编辑键盘 Shift：常态与激活态沿用 Enter 配色，激活时有明显反馈



  # rime组合键
  F4: {label: 方案菜单, send: F4}
