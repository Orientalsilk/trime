  liquid_keyboard_exit: {label: ' ⌨ ', send: FUNCTION, command: liquid_keyboard, option: "-1", label_text_size: 10}  #退出liquidkeyboard
  liquid_keyboard_emoji: { label: ☻, send: FUNCTION, command: liquid_keyboard, option: "😀" }
  keyboard_punctuation_cn: { label: ⌘, send: FUNCTION, command: liquid_keyboard, option: "中文" }


  menu_keyboard: { label: 菜单, send: FUNCTION, command: menu_keyboard }
  clipboard_window: { label: "ic@clipboard-multiple-outline", send: FUNCTION, command: "clipboard_window"}
  # rime状态
  Mode_switch: {toggle: ascii_mode, functional: true, send: SWITCH_CHARSET, states: [ 中文, ABC ]}
  # 逗号、句号：标点是英文/中文随 ascii_punct 显示（英文模式下自动是英文标点）
  Comma_en: {label: ",", functional: false, send: comma}   # 英文键盘（ascii_mode）下的逗号
  Period_en: {label: ".", functional: false, send: period}   # 英文键盘（ascii_mode）下的句号
  Comma_p: {toggle: ascii_punct, states: [ "，", "," ], functional: false, send: comma}
