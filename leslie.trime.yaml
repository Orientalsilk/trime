    keys: [ 符号: 'Vfh', 电脑: 'Vdn', 象棋: 'Vxq', 麻将: 'Vmj', 骰子: 'Vsz', 扑克: 'Vpk', 天气: 'Vtq', 音乐: 'Vyy', 八卦: 'Vbg', 易经: 'Vlssg', 天体: 'Vtt',  星座: 'Vxz',  星号: 'Vxh',  方块: 'Vfk',  几何: 'Vjh',  箭头: 'Vjt',  数学: 'Vsx',  上标: 'Vsb',  下标: 'Vxb',  单位: 'Vdw',  货币: 'Vhb',  拼音: 'Vpy',  注音: 'Vzy',  假名: 'Vjm',  片假: 'Vpjm',  韩文: 'Vhw',  希腊: 'Vxl',  希大: 'Vxld', 罗马:   'Vlm',  罗大:   'Vlmd', 俄语:   'Vey',  俄大:   'Veyd', 表情:  'Vbq',  一: 'V1',  二: 'V2',  三: 'V3',  四: 'V4',  五: 'V5',  六: 'V6',  七: 'V7',  八: 'V8',  九: 'V9',  零: 'V0',  十: 'V10',  分数: 'Vfs',  标点: 'Vbd',  偏旁: 'Vpp',  竖标:  'Vbdz'  ]

#键盘布局
preset_keyboards:
 # Floating window styles.
  # Enable "Show floating window when composing" to use.
  default:
    author: "暖暖"
    name: 26键默认布局
    width: 11.11
    height: *jpgd6
    horizontal_gap: *hgap
    vertical_gap: *sgap
    key_symbol_offset_y: 1
    key_hint_offset_y: -2 
    #height: 48
    label_transform: uppercase  
    ascii_mode: 0
    reset_ascii_mode: true
    ascii_keyboard: letter   # 中英键盘互切按钮：中文键盘 → 英文键盘
    lock: true
    keys:

      # 第一行
      - {click: q, width: 10, long_click: 1, swipe_up: 1, swipe_down: '`', hint: '`辅码',  key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: w, width: 10, long_click: 2, swipe_up: 2, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: e, width: 10, long_click: 3, swipe_up: 3, key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: r, width: 10, long_click: 4, swipe_up: 4, swipe_down: R, hint: '大写', key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: t, width: 10, long_click: 5, swipe_up: 5, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: y, width: 10, long_click: 6, swipe_up: 6, swipe_down: Keyboard_numberb, hint: '☩', key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: u, width: 10, long_click: 7, swipe_up: 7, swipe_down: uU,  hint: '拆', key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: i, width: 10, long_click: 8, swipe_up: 8, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: o, width: 10, long_click: 9, swipe_up: 9, key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: p, width: 10, long_click: 0, swipe_up: 0,  swipe_down: clipboard_window, hint: "ic@clipboard-multiple-outline", key_hint_offset_y: 1, key_hint_offset_x: +8, key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      # 第二行
      - {click: a, popup: ["select_all", "A-p", "a-p"], swipe_up: select_all, label_symbol: 'ic@checkbox-marked-outline',  key_symbol_offset_y: 3, key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: s, popup: ["s-p", "@", ":", "S-p"], swipe_up: '@', swipe_down: ':', label_symbol: '@', hint: ':', symbol_text_size: 14, key_symbol_offset_y: -2, key_hint_offset_y: 1, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: d, popup: ["d-p", "D-p"], swipe_up: date_time, label_symbol: '日期', swipe_down: Time, hint: "时间", key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: f, popup: ["/", ";", "f-p", "F-p"], swipe_up: "/", swipe_down: ";", label_symbol: '/',  hint: ";", symbol_text_size: 14, key_symbol_offset_y: -2, key_hint_offset_y: 1, key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: g, popup: ["=", "g-p", "G-p"], swipe_up: '=', label_symbol: '=', key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: h, popup: ["+", "h-p", "H-p"], swipe_up: '+', label_symbol: '+', swipe_down: '&', hint: '&', key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: j, popup: ["-", "j-p", "J-p"], swipe_up: '-', label_symbol: '-', key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: k, popup: ["k-p", "K-p"], swipe_up: '""{Left}', swipe_left: '"', swipe_right: '"', label_symbol: '""', swipe_down: '*', hint: '*', symbol_text_size: 14, key_hint_offset_y: 4, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: l, popup: ["l-p", "L-p"], swipe_up: "'", label_symbol: "'", swipe_down: '#', hint: '#', key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}

      # 第三行
      - {click: Shift_L, label_symbol: " ", width: 15, long_click: Shift_L, double_click: Shift_L3, composing: Escape, key_text_size: 16}
      - {click: z, popup: ["z-p", "Z-p"], width: 10, swipe_up: '<>{Left}', swipe_left: '<', swipe_right: '>', label_symbol: '<>', swipe_down: '~', hint: '~', symbol_text_size: 12, key_symbol_offset_y: -1, key_hint_offset_y: 2, key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: x, popup: ["cut", "x-p", "X-p"], width: 10, swipe_up: cut,  label_symbol: 'ic@content-cut', swipe_down: "!", hint: "!", symbol_text_size: 8, key_symbol_offset_y: 3, key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: c, popup: ["copy", "c-p", "C-p"], width: 10, swipe_up: copy, label_symbol: 'ic@checkbox-multiple-blank-outline', symbol_text_size: 8, key_symbol_offset_y: 3, swipe_down: 'cC', hint: '计算', key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: v, popup: ["paste_clip", "v-p", "V-p"], width: 10, swipe_up: paste_clip, label_symbol: 'ic@clipboard-text-outline', key_symbol_offset_y: 3, symbol_text_size: 8, swipe_down: 'V', hint: '符号', key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: b, popup: ["b-p", "|", "B-p"], width: 10, swipe_up: "|", label_symbol: '|', swipe_down: '%', hint: '%', key_text_color: TEX, key_back_color: BBB, hilited_key_back_color: BBH}
      - {click: n, popup: ["n-p", "N-p"], width: 10, swipe_down: 'lunar', swipe_up: "[]{Left}", swipe_left: "[", swipe_right: "]", label_symbol: "[]", hint: '农历', key_text_color: TEX, key_back_color: CCC, hilited_key_back_color: CCH}
      - {click: m, popup: ["m-p", "M-p"], width: 10, swipe_up: "(){Left}", swipe_left: "(", swipe_right: ")", label_symbol: "()", swipe_down: '\', hint: '\', key_text_color: TEX, key_back_color: AAA, hilited_key_back_color: AAH}
      - {click: BackSpace, label: '⌫', width: 15, key_text_size: "20", key_back_color: bksb, hilited_key_back_color: bksh, key_symbol_color: bkss, key_text_color: bkst}

      # 第四行
      - {click: Keyboard_number, width: 15, long_click: Keyboard_numbercn, composing: delimiterD, key_symbol_offset_y: 2, key_back_color: gnb, hilited_key_back_color: gnh, key_symbol_color: bds}
      - {click: keyboard_punctuation_cn, width: 10, label_symbol: "简洁", long_click: "{hide_key_symbol}{hide_key_hint}", key_text_size: "18", key_back_color: bdb, key_text_color: bdt, key_symbol_color: bds, hilited_key_back_color: bdh, hilited_key_text_color: hbdt}
      - {click: Comma_p, ascii: Comma_en, width: 10, key_text_offset_y: -5, key_back_color: bdb, key_text_color: bdt, key_symbol_color: bds, hilited_key_back_color: bdh, hilited_key_text_color: hbdt}
      - {click: Space_en, ascii: Space_letter, long_click: VOICE_ASSIST, swipe_left: "Left", swipe_right: "Right", swipe_down: IME_switch, width: 30, hilited_key_text_color: hkgt, key_back_color: kgb, key_text_color: kgt, key_symbol_color: bds, hilited_key_back_color: kgh}
      - {click: Period_p, ascii: Period_en, width: 10, long_click: Theme_settings, key_text_offset_y: -5, symbol_text_size: 8, key_back_color: bdb, key_text_color: bdt, key_symbol_color: bds, hilited_key_back_color: bdh, hilited_key_text_color: hbdt}
      - {click: '?', key_text_size: "18", width: 10, long_click: 'Color_switch', label_symbol: '', symbol_text_size: 8, key_back_color: bdb, key_text_color: bdt, key_symbol_color: bds, hilited_key_back_color: bdh, hilited_key_text_color: hbdt}
      - {click: Return, composing: Return1, width: 15, swipe_up: Escape, key_text_size: "18", key_back_color: hcb, key_text_color: hct, hilited_key_text_color: hcht, key_symbol_color: hcs, hilited_key_back_color: hch}

