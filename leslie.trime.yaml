tool_bar:
  button_spacing: 6
  button_font: iconfont.ttf
  back_style: "ic@arrow-left"

  # 左侧固定主按钮配置
  primary_button:
    background:
      type: circle          # 高亮形状 (circle|rectangle)
      corner_radius: 4      # 圆角半径
      normal: 0x00        # 正常状态背景颜色
      highlight: 0x00  # 高亮状态背景色（保持透明）
      vertical_inset: 4      # 垂直方向内缩量
      horizontal_inset: 0    # 水平方向内缩量
    foreground:
      style: "ic@view-dashboard"
      font_size: 16
      fg_normal: candidate_text_color  # 正常状态前景色
      padding: 10            # 前景内容与背景边界的内边距
    action: menu_keyboard
    long_press_action: Settings


  hide_button: &hide_button
    foreground:
      style: "ic@keyboard_close"
      normal: candidate_text_color
      font_size: 16
    action: Hide

  clipboard_button: &clipboard_button
    foreground:
      style: "ic@clipboard-multiple-outline"
      normal: candidate_text_color
      font_size: 14
    action: clipboard_window

  ascii_mode_button: &ascii_mode_button
    foreground:
      option_styles: ["🈭", "🄴"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 20
    action: Keyboard_cn_en

  en_mode_button: &en_mode_button
    foreground:
      option_styles: ["🅗", "🅔"] # 中英混输 / 只出英文（en_mode 开关）
      font_size: 20
    action: En_mode

  undo_button: &undo_button
    foreground:
      style: "ic@reply"
      normal: candidate_text_color
      font_size: 14
    action: undo

  redo_button: &redo_button
    foreground:
      style: "ic@share"
      normal: candidate_text_color
      font_size: 14
    action: redo

  ascii_punct_button: &ascii_punct_button
    foreground:
      option_styles: ["ic@moon_waxing_crescent", "ic@moon_full"] # 样式也可以为表，将根据 action 的 toggle 决定
      font_size: 14
    action: Punct_switch


  # 右侧按钮列表（从右向左排列）
  buttons: [ *hide_button, *clipboard_button, *redo_button, *undo_button, *ascii_punct_button, *en_mode_button, *ascii_mode_button]

    
    
    
liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非需要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6              #每屏最多显示多少行按键
  row_land: 4         #横屏每屏最多显示多少行按键
  key_height: 48      #按键高度
  key_height_land: 30 #横屏模式按键高度
  single_width: 46    #single类型的按键宽度
  vertical_gap: 6     #纵向按键间隙
  margin_x: 2       #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: right  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - BackSpace1
      - Left
      - Right
      - space1
      - Return2
  keyboards:
    - history
    - clipboard
    # 表情
    - punctuation_cn
    - punctuation_en
    - emoji_face
    - emoji_body
    - emoji_clothes
    - emoji_nature
    - emoji_food
    - emoji_activity
    - emoji_vehicle_and_place
    - emoji_symbol
    - emoji_flag
    - heart
    - bracket
    - currency
    - jxqi
    - mathematics
    - symbol_number
    - symbol_bc
    - latin_type
    - unit
    - enclosed_cn
    - enclosed_latin
    - arrow
    - asterisk
    - triangle
    - quadrangle
    - circle
    - symbolic
    - check
    - card
    - signage
    - box_line
    - pinyin
    - yinbiao
    - rusa
    - lation
    - jp
    - korea
    - greek_font
    - hexagram
    - alchemy
    - technical
    - symbollist

