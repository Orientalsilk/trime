# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: 雾凇6 · 优化版
author: Leslie

# ========== 键盘高度 & 间隙（必须为整数）==========
height:
  4: &jpgd4 50      # 主键盘行高
  5: &jpgd5 40      # 符号键盘
  6: &jpgd6 52      # 注音键盘
  7: &hgap 2       # 水平间隙
  8: &sgap 9       # 垂直间隙

# ========== 圆角 ==========
round_corner:
  1: &round1 8      # 按键圆角

# ========== 界面风格 ==========
style:
  auto_caps: false #自动句首大写:true|false
  candidate_font: ["LXGWWenKai-Regular.ttf"] #["han.ttf"]   #候选字体
  candidate_padding: 8  #候选项内边距
  candidate_spacing: 0.0  #候选分割线
  candidate_text_size: 21  # 候选字号
  candidate_text_vertical_bias: 1.0 #选项文本垂直偏移位置
  candidate_view_height: 40 # 候选区高度
  candidate_corner_radius: *round1 #候选区圆角半径
  comment_font: comment.ttf #编码提示字体
  comment_height: 6 #编码提示区高度
  comment_position: overlay #编码提示布局位置
  comment_vertical_bias: 0 #编码提示垂直偏移位置
  comment_text_size: 11 #编码提示字号
  hanb_font: ["Jigmo2.ttf"] #["HanaMinB.ttf"] #擴充字體
  horizontal_gap: *hgap #键水平间距
  keyboard_padding: 0
  keyboard_padding_left: 0
  keyboard_padding_right: 0
  keyboard_padding_bottom: 10
  keyboard_padding_land: 60
  keyboard_padding_land_bottom: 0
  key_font: symbol.ttf #["LucidaGrande.ttc"]
  key_height: *jpgd4 #键高
  key_long_text_size: 16
  key_text_size: 23
  key_width: 10.0
  label_text_size: 20
  label_font: label.ttf
  latin_font: latin.ttf
  keyboard_height: 250
  keyboard_height_land: 200
  popup_font: latin.ttf
  popup_width: 38
  popup_height: 48
  popup_bottom_margin: 68
  popup_key_height: 48
  popup_text_size: 23
  reset_ascii_mode_on_focus_change: false
  round_corner: *round1
  key_border: 1
  shadow_radius: 0
  symbol_font: symbol.ttf
  symbol_text_size: 9
  text_font: latin.ttf
  vertical_gap: *sgap
  long_text_font: comment.ttf
  enter_label_mode: 0
  margin_x: 5 #水平邊距 NOTE: margin_{x, y, bottom} 实际为 padding
  margin_y: 5 #竖直边距
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre:  上个
    search: 搜索
    send: 发送
    default: Enter

preedit:
  horizontal_padding: 8
  alpha: 0.8
  top_end_radius: 4
  foreground:
    font_size: 16

window:
  insets:
    vertical: 4
    horizontal: 4
  item_padding:
    horizontal: 4
  foreground:
    label_font_size: 20
    text_font_size: 20
    comment_font_size: 16

# 最好保留一项，防止其他主题使用 __include 时无法加载
fallback_colors:
  # 悬浮窗
  border_color: back_color #悬浮窗边框
  label_color: hilited_text_color #标签（候选序号）
  text_back_color: back_color #编码区背景
  # text_color:  #编码
  hilited_back_color: back_color #高亮编码背景
  hilited_text_color: text_color #高亮编码

  # 候选栏
  candidate_separator_color: back_color #候选分割线
  # back_color:  #候选栏背景
  candidate_text_color: hilited_text_color #候选文字
  comment_text_color: candidate_text_color #提示
  hilited_candidate_back_color: back_color #高亮候选背景
  hilited_candidate_text_color: text_color #高亮候选文字
  hilited_comment_text_color: hilited_candidate_text_color #高亮提示

  # 键盘通用
  keyboard_back_color: back_color #键盘背景
  key_border_color: back_color #按键边框
  shadow_color: back_color #按键文字阴影
  preview_back_color: back_color #按键提示背景
  preview_text_color: key_text_color #按键提示文字
  key_text_color: candidate_text_color #按键文字
  key_symbol_color: comment_text_color #按键符号
  hilited_key_text_color: key_text_color #高亮按键文字
  hilited_key_symbol_color: key_symbol_color #高亮按键符号

  # 主键盘
  main_back_color: back_color #按键背景 ※
  hilited_main_back_color: back_color #高亮按键背景 ※
  space_back_color: main_back_color #空格背景 ※
  hilited_space_back_color: hilited_main_back_color #高亮空格背景 ※
  off_key_back_color: hilited_main_back_color #功能键背景
  off_key_text_color: key_text_color #功能键文字
  off_key_symbol_color: off_key_text_color #功能键符号 高亮功能键符号※
  hilited_off_key_back_color: main_back_color #高亮功能键背景
  hilited_off_key_text_color: off_key_text_color #高亮功能键文字
  on_key_back_color: hilited_off_key_back_color #shift锁定时背景
  on_key_text_color: hilited_key_text_color #shift锁定时文字
  hilited_on_key_back_color: off_key_back_color #高亮shift锁定时背景
  hilited_on_key_text_color: on_key_text_color #高亮shift锁定时文字
  enter_back_color: on_key_back_color #enter背景 ※
  enter_text_color: on_key_text_color #enter文字 高亮enter文字※
  enter_symbol_color: enter_text_color #enter符号 高亮enter符号※
  hilited_enter_back_color: hilited_on_key_back_color #高亮enter背景 ※

  # 附键盘
  key_back_color: back_color #按键背景
  hilited_key_back_color: back_color #高亮按键背景
  off_sym_back_color: hilited_key_back_color #功能键背景 ※
  off_sym_text_color: off_key_text_color #功能键文字 ※
  off_sym_fy_text_color: hilited_off_sym_back_color #翻页停止箭头文字 高亮※
  hilited_off_sym_back_color: key_back_color #高亮功能键背景 ※
  hilited_off_sym_text_color: hilited_off_key_text_color #高亮功能键文字 ※
  enter_sym_back_color: off_sym_back_color # enter背景 ※
  enter_sym_text_color: on_key_text_color #enter文字 高亮enter文字※
  hilited_enter_sym_back_color: hilited_off_sym_back_color #高亮enter背景 ※
  menu_back_color: off_sym_back_color #菜单背景 ※
  menu_text_color: off_sym_text_color #菜单文字 ※
  hilited_menu_back_color: key_back_color #高亮菜单背景 ※
  hilited_menu_text_color: enter_sym_back_color #高亮菜单文字 ※

  liquid_keyboard_background: on_key_back_color # liquidKeyboard的背景图/色

# ========== 颜色锚点 ==========
colors:
  1: &COLOR_BLACK       0xff000000   # 黑
  2: &COLOR_WHITE       0xffffffff   # 白
  3: &COLOR_TRANSPARENT 0x00000000   # 透明
  5: &COLOR_LIGHT_GRAY  0xffe8eaed   # 浅灰背景
  6: &COLOR_HILITE      0xffd1d5db   # 浅色高亮
  7: &COLOR_ICE_BLUE    0xff0ea5e9   # 冰蓝
  8: &COLOR_ICE_DARK    0xff0284c7   # 深冰蓝
  10: &COLOR_ICE_DEEP    0xff0369a1   # 更深冰蓝（锁定后按下）


preset_color_schemes:
  default:
    name: "雾凇·日"
    author: "leslie"
    dark_scheme: default_dark
    back_color: *COLOR_LIGHT_GRAY    # 候选区背景
    border_color: *COLOR_LIGHT_GRAY   #悬浮窗边框
    candidate_separator_color: *COLOR_TRANSPARENT   #候选区分隔颜色
    candidate_text_color: 0xff696969  # 候选区文本颜色
    comment_text_color: 0xFFADADAD   # 候选区编码文本颜色
    hilited_back_color: *COLOR_TRANSPARENT   #悬浮窗高亮编码背景
    hilited_candidate_back_color: *COLOR_ICE_BLUE   # 候选区高亮背景 (冰蓝)
    hilited_candidate_text_color: *COLOR_WHITE     # 候选区高亮文本
    hilited_comment_text_color: *COLOR_WHITE   # 候选区高亮编码文本颜色
    hilited_key_back_color: *COLOR_HILITE   #按键激活背景颜色
    hilited_key_symbol_color: 0xff6f7b83   #按键激活符号颜色
    hilited_key_text_color: *COLOR_BLACK  #按键激活文本颜色
    hilited_off_key_back_color: *COLOR_HILITE   #激活功能键，shift常态 背景颜色
    hilited_off_key_text_color: *COLOR_BLACK   #激活功能键，shift常态 文本颜色
    hilited_on_key_back_color: *COLOR_ICE_DARK   # shift锁定按下背景
    hilited_on_key_text_color: *COLOR_WHITE   #shift锁定时的高亮文本
    hilited_text_color: 0xff23948e   #悬浮窗高亮编码
    key_back_color: *COLOR_WHITE   #按键背景颜色
    key_border_color: 0xA08A8A90   #按键边框颜色
    key_symbol_color: 0xff6f7b83   #按键符号颜色
    key_text_color: 0xff4a4a4a   #按键文本颜色
    keyboard_back_color: 0xfff1f3f4  # 键盘背景 (更干净)
    off_key_back_color: *COLOR_WHITE  #功能键背景
    off_key_text_color: 0xff4d4d4d  #功能键文本
    on_key_back_color: *COLOR_ICE_BLUE # shift 锁定背景
    on_key_text_color: *COLOR_WHITE    # shift 锁定文本
    preview_back_color: *COLOR_ICE_BLUE  # 按键气泡背景
    preview_text_color: *COLOR_WHITE  #按键气泡文本
    shadow_color: 0xA0A5A5AA  #按键文字阴影
    text_color: 0xff5b696f  #悬浮窗编码
    text_back_color: *COLOR_WHITE   #编码区悬浮窗背景
