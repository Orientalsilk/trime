name: Build APK (arm64, Linux only)
on:
  workflow_dispatch:

env:
  CI_NAME: Build APK
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Download sherpa-onnx prebuilt libraries (voice input)
        run: |
          curl -fL --retry 3 -o /tmp/sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa app/src/main/jniLibs/arm64-v8a
          tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa
          cp /tmp/sherpa/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Download voice model into assets (bundled in APK)
        run: |
          D=app/src/main/assets/sherpa-paraformer-zh-en
          mkdir -p $D
          for f in encoder.int8.onnx decoder.int8.onnx tokens.txt; do
            for base in https://huggingface.co https://hf-mirror.com; do
              if curl -fL --retry 3 -o "$D/$f" "$base/csukuangfj/sherpa-onnx-streaming-paraformer-bilingual-zh-en/resolve/main/$f"; then break; fi
            done
            test -s "$D/$f"
          done
          ls -la $D

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: linux-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Remove duplicate sherpa libs from cached prebuilt
        shell: bash
        run: |
          # sherpa-onnx libs come from app/src/main/jniLibs; a stale copy in the cache would collide
          rm -f app/prebuilt/*/libonnxruntime.so app/prebuilt/*/libsherpa-onnx-*.so || true

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Build debug Trime
        run: |
          set +e
          make debug 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -E "^e: |error:|What went wrong|Caused by|Execution failed|FAILURE|Could not|duplicate|More than one" /tmp/build.log | head -25 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=BUILD-ERROR::$msg"
          fi
          exit $rc

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: |
          cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt
          rm -f app/prebuilt/*/libonnxruntime.so app/prebuilt/*/libsherpa-onnx-*.so

      - name: Upload APK artifact (ARM64_V8A only)
        uses: actions/upload-artifact@v7
        with:
          name: trime-arm64-v8a-linux
          path: app/build/outputs/apk/debug/*arm64-v8a-*.apk
          # keep 90 days
          retention-days: 90
