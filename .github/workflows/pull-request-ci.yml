name: Pull Request

on:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_NAME: Pull Request CI
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-26.04"]') || fromJSON('["ubuntu-26.04", "macos-26", "macos-26-intel", "windows-2025"]') }}
    env:
      BUILD_ABI: armeabi-v7a,arm64-v8a,x86,x86_64
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Check code style
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          ./gradlew spotlessApply
          git diff -- app/src/main/java/com/k2fsa/sherpa/onnx/ app/src/main/java/com/osfans/trime/ime/keyboard/CommonKeyboardActionListener.kt app/src/main/java/com/osfans/trime/voice/
          make style-lint

      - name: Run unit tests
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: ./gradlew test

      - name: Calculate JNI cache hash
        if: ${{ github.event_name == 'pull_request' }}
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ matrix.os }}-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Fetch submodules
        if: ${{ github.event_name == 'pull_request' && !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Build debug Trime
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          make debug

      - name: Add JNI cache
        if: ${{ github.event_name == 'pull_request' && !steps.jni-cache.outputs.cache-hit }}
        shell: bash
        run: cp -R app/build/intermediates/merged_native_libs/debug/mergeDebugNativeLibs/out/lib app/prebuilt

      - name: Upload APK artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: trime-${{ matrix.os }}
          path: app/build/outputs/apk/debug/
          # keep 30 days
          retention-days: 30
