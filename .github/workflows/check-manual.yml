name: Check (style, unit tests, lint)
on:
  workflow_dispatch:

env:
  CI_NAME: Build APK
jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      BUILD_ABI: arm64-v8a
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Get branch name
        id: vars
        shell: bash
        run: |
          echo ${GITHUB_REF#refs/*/}
          echo CI_BRANCH=${GITHUB_REF#refs/*/} >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Download sherpa-onnx prebuilt libraries (voice input)
        run: |
          curl -fL --retry 3 -o /tmp/sherpa-android.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-android.tar.bz2
          mkdir -p /tmp/sherpa app/src/main/jniLibs/arm64-v8a
          tar xjf /tmp/sherpa-android.tar.bz2 -C /tmp/sherpa
          cp /tmp/sherpa/jniLibs/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: |
            ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: linux-trime-jni-debug-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Remove duplicate sherpa libs from cached prebuilt
        shell: bash
        run: |
          # sherpa-onnx libs come from app/src/main/jniLibs; a stale copy in the cache would collide
          rm -f app/prebuilt/*/libonnxruntime.so app/prebuilt/*/libsherpa-onnx-*.so || true

      - name: Fetch submodules
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: |
          git submodule update --init --recursive

      - name: Style, unit tests and lint
        run: |
          set +e
          {
            echo "### make style-lint"; make style-lint
            echo "### testDebugUnitTest"; ./gradlew :app:testDebugUnitTest
            echo "### lintDebug"; ./gradlew :app:lintDebug
          } 2>&1 | tee /tmp/check.log
          if grep -qE "FAILURE: Build failed|BUILD FAILED|Execution failed|^e: |error:" /tmp/check.log; then
            msg=$(grep -E "^e: |error:|What went wrong|Caused by|Execution failed|FAILED|Error:|Lint found|Violations" /tmp/check.log | head -30 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=CHECK-ERROR::$msg"
            exit 1
          fi
