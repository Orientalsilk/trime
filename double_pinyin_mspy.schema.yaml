# Rime schema
# encoding: utf-8

# 复制自 rime_ice.schema.yaml ，适配了双拼。
# 双拼键位映射复制自 https://github.com/rime/rime-double-pinyin
# 双拼之间主要就是 speller/algebra 和 translator/preedit_format 这里有区别。
#
# 全拼的自定义文本和双拼有些冲突，改成了 custom_phrase_double ，需要创建 custom_phrase_double.txt 文件。
#
# 目前配置中有个别功能仍然是全拼拼写，不能自动适配，所以需要手动修改一下：
# - 英文中部分符号的派生规则：在英文方案文件 melt_eng.schema.yaml > speller > algebra 修改为对应的双拼拼写运算
# - 部件拆字的拼写规则：在部件拆字方案 radical_pinyin.schema.yaml > speller > algebra 修改为对应的双拼拼写运算
# 打个补丁一劳永逸，补丁写法参考 [常见问题](https://github.com/iDvel/rime-ice/issues/133) 或 others/patch_examples/ 文件夹


# 方案说明
schema:
  schema_id: double_pinyin_mspy
  name: 微软双拼
  version: "1"
  author:
    - Dvel
  description: |
     - 微软双拼

  dependencies:
    - radical_mspy  
    - en_comment      # 英文释义词库（反查显示释义）
    - english         # 英文常用词库（english.schema.yaml 挂载，边打边补全）
    - english_full    # 完整英文词库（整词匹配）


# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
# abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
switches:
  - name: ascii_mode
    states: [ 中, Ａ ]
  - name: ascii_punct  # 中英标点
    states: [ ¥, $ ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    states: [ 💀, 😄 ]
    reset: 1
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: en_mode      # 英文模式：只出英文候选，标点用英文（工具栏按钮切换）
    states: [ 中英, 英文 ]
    abbrev: [ 混, 英 ]
    reset: 0
  - name: search_single_char  # search.lua 的功能开关，辅码查词时是否单字优先
    states: [正常, 单字]
    abbrev: [词, 单]


# 输入引擎
engine:
  processors:
    # - lua_processor@*lag_probe_processor         # 卡顿探针：慢的按键记到 lag_probe.log（调试时再开启）
    - lua_processor@*en_mode_processor             # 英文模式切换时同步英文标点
    - lua_processor@*select_character  # 以词定字
    - lua_processor@*cold_word_drop.processor  # 词条隐藏/降频/删词 快捷键
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - lua_segmentor@*en_wild_segmentor            # 英文查词：通配符 * _ 和词性 ~
    - matcher
    - abc_segmentor
    - affix_segmentor@radical_lookup  # 部件拆字自定义 tag
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
    - lua_translator@*date_translator    # 时间、日期、星期
    - lua_translator@*lunar              # 农历
    - lua_translator@*uuid               # UUID
    - table_translator@custom_phrase     # 自定义短语 custom_phrase_double.txt
    - table_translator@english_exact     # 完整英文词库，只做整词匹配
    - lua_translator@*en_boost           # 精准识别英文：整词匹配/长词前缀/缩写（leslie's）排到前面
    - lua_translator@*en_wild_translator          # 英文查词：通配符、词性筛选、连写拆词
    - table_translator@cn_en             # 中英混合词汇
    - table_translator@radical_lookup    # 部件拆字反查
    - lua_translator@*unicode            # Unicode
    - lua_translator@*number_translator  # 数字、金额大写
    - lua_translator@*calc_translator    # 计算器
    - lua_translator@*force_gc           # 暴力 GC
  filters:
    - lua_filter@*en_mode_filter                    # 英文模式：只留英文候选
    - lua_filter@*en_user_filter                    # 英文模式：个人常用词优先 + 拼写纠正
    - lua_filter@*corrector                         # 错音错字提示
    - lua_filter@*is_in_user_dict                   # 用户词典内容标 *
    - lua_filter@*cold_word_drop.filter             # 词条隐藏/降频
    - reverse_lookup_filter@radical_reverse_lookup  # 部件拆字滤镜
    - lua_filter@*en_comment_filter                 # 英文音标 + 中文释义
    - lua_filter@*autocap_filter                    # 英文自动大写
    - lua_filter@*search@radical_mspy                # 部件拆字辅码（双拼专用副本，algebra_double_pinyin_mspy）
    - lua_filter@*pin_cand_filter                   # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
    - lua_filter@*long_word_filter                  # 长词优先（顺序要求：长词优先 > Emoji）
    - lua_filter@*reduce_english_filter             # 降低部分英语单词在候选项的位置
    - lua_filter@*grammar_hint             # 整句候选标 ∞
    - simplifier@emoji                              # Emoji
    - simplifier@traditionalize                     # 简繁切换
    - lua_filter@*cn_en_spacer                      # 中英混输词条自动空格
    - lua_filter@*en_spacer                         # 英文词条上屏自动空格（须在倒数第二位）
    # - lua_filter@*lag_probe_filter                # 卡顿探针（须在 uniquifier 前面，调试时再开启）
    - uniquifier                                    # 去重


# Lua 配置: 日期、时间、星期、ISO 8601、时间戳的触发关键字
date_translator:
  date: date            # 日期： 2022-11-29
  time: time            # 时间： 18:13
  week: week            # 星期： 星期二
  datetime: datetime    # ISO 8601： 2022-11-29T18:13:11+08:00
  timestamp: timestamp  # 时间戳： 1669716794
  datezh: datezh        # 中文日期： 二〇二六年二月二十五日 | 二零二六年二月二十五日
  dateen: dateen        # 英文日期： 英式 8 March 2026 | 美式 March 8, 2026
  date_formats:
    - "Y年m月d日"
    - "Y-m-d"
    - "Y/m/d"
    - "Y.m.d"
    - "Ymd"
    - "Y年n月j日"
    - "y年n月j日"
    - "n月j日"
  time_formats:
    - "H:M"
    - "H点M分"
    - "H:M:S"
    - "H时M分S秒"
    - "AI:M"
    - "I:M P"
  datetime_formats:
    - "Y-m-d H:M:S"
    - "Y-m-dTH:M:S O"
    - "YmdHMS"
    - "Y年m月d日 H点M分"
    - "y/m/d I:M p"

# Lua 配置：农历
# 农历触发关键字
# template 字段：{干支年} {农历月} {农历日} {生肖} {俗称农历月} {简记农历日}
lunar: lunar
lunar_template: "{干支年}{生肖}年{俗称农历月}{农历日}"


# Lua 配置: 生成 UUID 的触发关键字
uuid: uuid


# Lua 配置：长词优先
# 提升 count 个词语，插入到第 idx 个位置。
long_word_filter:
  count: 2
  idx: 4


# Lua 配置: 降低部分英语单词在候选项的位置。
# 详细介绍 https://dvel.me/posts/make-rime-en-better/#短单词置顶的问题
# 正常情况： 输入 rug 得到 「1.rug 2.如果 …… 」
# 降低之后： 输入 rug 得到 「1.如果 2.rug …… 」
# 几种模式：
# all     降低脚本内置的单词（所有 3~4 位长度、前 2~3 位是完整拼音、最后一位是声母），words 作为自定义的额外补充
# custom  完全自定义，只降低 words 里的
# none    不降低任何单词，相当于没有启用这个 Lua
# （匹配的是编码，不是单词）
reduce_english_filter:
  mode: custom  # all | custom | none
  idx: 2        # 降低到第 idx 个位置
  # 自定义的单词列表，示例列表没有降低部分常用单词，如 and cat mail Mac but bad shit ……
  words: [
    aid, ann,
    bail, bait, bam, band, bans, bat, bay, bend, bent, benz, bib, bid, bien, biz, boc, bop, bos, bud, buf, bach, bench, bush,
    cab, cad, cain, cam, cans, cap, cef, chad, chan, chap, chef, cher, chew, chic, chin, chip, chit, coup, cum, cunt, cur, couch,
    dab, dag, dal, dam, dent, dew, dial, diet, dim, din, dip, dis, dit, doug, dub, dug, dunn,
    fab, fax, fob, fog, foul, fur,
    gag, gail, gain, gal, gam, gaol, ged, gel, ger, guam, gus, gut,
    hail, ham, hank, hans, hat, hay, heil, heir, hem, hep, hud, hum, hung, hunk, hut, hush,
    jim, jug,
    kat,
    lab, lad, lag, laid, lam, laos, lap, lat, lax, lay, led, leg, lex, liam, lib, lid, lied, lien, lies, linn, lip, lit, liz, lob, lug, lund, lung, lux, lash, loch, lush,
    mag, maid, mann, mar, mat, med, mel, mend, mens, ment, mil, mins, mint, mob, moc, mop, mos, mot, mud, mug, mum, mesh,
    nap, nat, nay, neil, nib, nip, noun, nous, nun, nut, nail, nash,
    pac, paid, pail, pain, pair, pak, pal, pam, pans, pant, pap, par, pat, paw, pax, pens, pic, pier, pies, pins, pint, pit, pix, pod, pop, pos, pot, pour, pow, pub, pinch, pouch,
    rand, rant, rent, rep, res, ret, rex, rib, rid, rig, rim, rub, rug, rum, runc, runs, ranch,
    sac, sail, sal, sam, sans, sap, saw, sax, sew, sham, shaw, shin, sig, sin, sip, sis, suit, sung, suns, sup, sur, sus,
    tad, tail, taj, tar, tax, tec, ted, tel, ter, tex, tic, tied, tier, ties, tim, tin, tit, tour, tout, tum,
    wag, wand, womens, wap, wax, weir, won,
    yan, yen,
    zach
  ]


# Lua 配置: 置顶候选项
# 注释太长了，请参考 pin_cand_filter.lua 开头的说明书。
pin_cand_filter:
  # 格式：编码<Tab>字词1<Space>字词2……
  - "d\t的"


# 主翻译器，拼音
grammar:
  language: zh-hans-t-essay-bgw
translator:
  dictionary: leslie         # 挂载词库 leslie.dict.yaml
  prism: double_pinyin_mspy     # 多方案共用一个词库时，为避免冲突，需要用 prism 指定一个名字。
  enable_word_completion: true  # 大于 4 音节的词条自动补全，librime > 1.11.2
  enable_user_dict: true
  enable_sentence: true
  max_word_length: 10
  core_word_length: 4
  contextual_suggestions: true
  max_homophones: 10
  max_homographs: 10
  max_sentences: 2            # 造句数量，偏好长句输入可设置大于 1，librime ≥ 1.17.0
  spelling_hints: 8             # corrector.lua ：为了让错音错字提示的 Lua 同时适配全拼双拼，将拼音显示在 comment 中
  always_show_comments: true    # corrector.lua ：Rime 默认在 preedit 等于 comment 时取消显示 comment，这里强制一直显示，供 corrector.lua 做判断用。
  # keep_comments: true         # corrector.lua ：显示拼音注释
  initial_quality: 1.5          # 拼音的权重应该比英文大
  comment_format:               # 标记拼音注释，供 corrector.lua 做判断用
    - xform/^/［/
    - xform/$/］/
  preedit_format: []


# 常用词库（带补全）：不挂在引擎里，只给 en_boost.lua 取「以输入开头的词」用。
english_pre:
  dictionary: english_top
  enable_completion: true
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 完整英文词库，只做整词精确匹配（不补全）：生僻词也能打出来，又不拖慢补全。
english_exact:
  dictionary: english
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1.1
  comment_format:
    - xform/.*//

# 英文精准识别（en_boost.lua）
# 输入里有任何一对字母拼不出双拼音节时，才认为是英文；整句双拼不受影响。
en_boost:
  min_len: 4         # 整词精确匹配的最短字母数
  prefix_min_len: 5  # 输入达到这个长度，且是英文单词的开头时，也把英文候选提前
  prefix_count: 5    # 提前的英文候选最多几个
  quality: 60        # 提前后的权重，比拼音(1.5)大，比自定义短语(99)小
  soft_count: 4      # 可能是双拼的输入（3 个字母起），在汉字后面补几个开头相同的常用词
  en_prefix_count: 8 # 英文模式下，补全最多给几个


# 英文释义（反查）：在英文候选后面显示音标/中文释义。词库 en_comment.dict.yaml 里已截短并转为简体。
# 释义里的 @ 表示空格（词库里不能直接写空格），显示时换成空格。
en_comment:
  dictionary: en_comment
  enabled: true         # 设成 false 就不显示音标和释义
  max_candidates: 12   # 只给靠前的这么多个候选加释义

# 英文个人词库 / 拼写纠正（en_user_filter.lua）
# 打过 2 次以上的词会记在用户目录 en_user_words.txt 里，可以用记事本编辑；拼写纠正表是 lua/en_typos.txt
en_user:
  enabled: true
  max_candidates: 3     # 最多提前几个个人常用词

# 英文模式的自动空格 / 句首大写（en_spacer.lua）
en_spacer:
  auto_capitalize: true   # 句号、问号、感叹号、换行之后的英文单词首字母自动大写
  mixed_mode_space: true  # 中英混输时，英文词接在英文词 / 英文逗号句号后面也自动补空格
  capital_i: true         # 单独的 i、i'm、i'll 自动写成 I
  idle_reset_seconds: 60  # 超过这么多秒没上屏过东西，下一个词当作新一段的开头（首字母大写）；0 = 不判断


# 中英混合词汇
cn_en:
  dictionary: ""
  user_dict: en_dicts/cn_en_mspy
  db_class: stabledb
  enable_completion: true
  enable_sentence: false
  initial_quality: 0.5
  comment_format:
    - xform/^.+$//


# 自定义短语
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase_double  # 需要手动创建 custom_phrase_double.txt 文件
  db_class: stabledb
  enable_completion: false # 补全提示
  enable_sentence: false   # 禁止造句
  initial_quality: 99      # custom_phrase 的权重应该比 pinyin 和 melt_eng 大


# Emoji
emoji:
  option_name: emoji         # 对应 switches 中的 name
  opencc_config: emoji.json  # 选择要加载的 OpenCC 配置
  inherit_comment: false     # 在 corrector.lua 及反查中，emoji 的 comment 显示为空


# 简繁切换
traditionalize:
  option_name: traditionalization  # 对应 switches 中的 name
  opencc_config: s2t.json          # s2t.json | s2hk.json | s2tw.json | s2twp.json （Rime 内置配置，在程序目录可找到）
  tips: none                       # 转换提示: all 都显示 | char 仅单字显示 | none 不显示。
  tags: [ abc, number, gregorian_to_lunar ]  # 限制在对应 tag，不对其他如反查的内容做简繁转换


# 标点符号
# punctuator 下面的三个子项：
#   full_shape 全角标点映射
#   half_shape 半角标点映射
#   symbols    Rime 的预设配置是以 '/' 前缀开头输出一系列字符，自定义的 symbols_caps_v.yaml 修改成了 'V' 开头。
# 以及新版 digit_separators 相关的属性
punctuator:
  __include: default:/punctuator               # 从 default.yaml 导入 punctuator 的所有配置，为了引用 digit_separators 等属性
  full_shape:
    __include: default:/punctuator/full_shape  # 从 default.yaml 导入配置
  half_shape:
    __include: default:/punctuator/half_shape  # 从 default.yaml 导入配置
  symbols:
    __include: symbols_caps_v:/symbols         # 从 symbols_caps_v.yaml 导入配置


# 部件拆字反查
radical_lookup:
  tag: radical_lookup
  dictionary: radical_pinyin
  enable_user_dict: false
  prefix: "uU"  # 反查前缀（反查时前缀会消失影响打英文所以设定为两个字母，或可改成一个非字母符号），与 recognizer/patterns/radical_lookup 匹配
  tips: "  〔拆字〕"
  comment_format:
    - erase/^.*$//
# 部件拆字滤镜
radical_reverse_lookup:
  tags: [ radical_lookup ]
  # dictionary 为拼音标注来源，目前是显示本方案词库的注音。
  # 可去部件拆字方案下载更全的、带声调的、已编译好的词典： https://github.com/mirtlecn/rime-radical-pinyin#反查带声调注音
  dictionary: leslie   # 原来写的 rime_ice，但词库文件已经改名叫 leslie 了，不改这里注音会失效
  # comment_format:     # 自定义 comment，例如在左右加上括号
  #  - xform/^/(/
  #  - xform/$/)/


# 处理符合特定规则的输入码，如网址、反查

recognizer:
  import_preset: default                # 从 default.yaml 继承通用的
  patterns:                             # 再增加方案专有的：
    punct: "^V([0-9]|10|[A-Za-z]+)$"    # 响应 symbols_caps_v.yaml 的 symbols
    radical_lookup: "^uU[a-z;]+$"       # 响应部件拆字的反查，触发前缀与 radical_lookup/prefix 匹配
    unicode: "^U[a-f0-9]+"              # 脚本将自动获取第 2 个字符 U 作为触发前缀，响应 lua_translator@*unicode，输出 Unicode 字符
    number: "^R[0-9]+[.]?[0-9]*"        # 脚本将自动获取第 2 个字符 R 作为触发前缀，响应 lua_translator@*number_translator，数字金额大写
    calculator: "^cC.+"                 # 响应 lua_translator@*calc_translator，计算器。前缀设定项 calculator/prefix
    gregorian_to_lunar: "^N[0-9]{1,8}"  # 响应 lua_translator@*lunar，公历转农历
    uppercase: ""  # 覆写默认的 uppercase 使其可以在输入大写后，输入数字

# 从 default 继承快捷键
key_binder:
  import_preset: default  # 从 default.yaml 继承通用的
  search: "`"             # 辅码引导符，要添加到 speller/alphabet
  bindings/+:             # 追加方案专有快捷键（必须是列表格式，带 -）
    - { when: composing, accept: Control+Shift+9, send: semicolon }


# editor 用来定制操作键的行为，以下是默认行为 https://github.com/rime/librime/blob/master/src/rime/gear/editor.cc
editor:
  bindings:
    space: confirm                        # 空格键：上屏候选项
    Return: commit_raw_input              # 回车键：上屏原始输入
    Control+Return: commit_script_text    # Ctrl+回车键：上屏变换后输入（经过 preedit_format 转换的）
    Control+Shift+Return: commit_comment  # Ctrl+Shift+回车键：上屏 comment
    BackSpace: revert                     # 退格键：向前删除（撤消上次输入）
    Delete: delete                        # Delete 键：向后删除
    Control+BackSpace: back_syllable      # Ctrl+退格键：删除一个音节
    Control+Delete: delete_candidate      # Ctrl+Delete键：删除或降权候选项
    Escape: cancel                        # Esc 键：取消输入

# 拼写设定
speller:
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA;`'
  # initials 定义仅作为始码的按键，排除 ` ; 让单个的 ` ; 可以直接上屏
  initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  delimiter: " "  # 仅保留空格作为音节分隔符；单引号作为英文字符使用。
  algebra:
